# scripts/languages.yml
#
# The 26 grammars of the bundled detector model (`crystal run --release scripts/model.cr -- build`).
# name: grammar name, as `Language.find` looks it up; repo: GitHub owner/name; revision: pinned commit;
# license: of the grammar repository; family: superset group for scoring (defaults to name);
# corpus / examples: directories in the repository (default test/corpus and examples);
# github: GitHub language name that `discover` searches repositories for (none: files come from other repositories);
# extensions: file extensions or file names that label real code with this grammar (shared ones are dropped).

- name: bash
  repo: tree-sitter/tree-sitter-bash
  revision: a06c2e4415e9bc0346c6b86d401879ffb44058f7
  license: MIT
  github: "Shell"
  extensions: ["sh", "bash", ".bashrc", ".bash_profile", "ebuild", "eclass"]

- name: c
  repo: tree-sitter/tree-sitter-c
  revision: b780e47fc780ddc8da13afa35a3f4ed5c157823d
  license: MIT
  family: c
  github: "C"
  extensions: ["c", "h"]

- name: cpp
  repo: tree-sitter/tree-sitter-cpp
  revision: c009222808634c1014f82438d4883753516a2c24
  license: MIT
  family: c
  github: "C++"
